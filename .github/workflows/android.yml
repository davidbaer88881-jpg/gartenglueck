name: Android-App bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['BUILD-TRIGGER.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - id: bau
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v4
        if: success() && env.NEW_KEY == '1'
        with:
          name: UPLOAD-SCHLUESSEL-SICHER-AUFBEWAHREN
          path: schluessel/
          retention-days: 14
      - if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SCHRITTE: ${{ toJSON(steps) }}
        run: bash scripts/ci-status.sh
